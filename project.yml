name: SmartReminders
options:
  bundleIdPrefix: com.meanweasel
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
targets:
  SmartReminders:
    type: application
    platform: iOS
    sources:
      - SmartReminders
    info:
      path: SmartReminders/Info.plist
      properties:
        NSRemindersFullAccessUsageDescription: Smart Reminders creates Apple Reminders only after you approve the parsed draft.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meanweasel.smartreminders
  SmartRemindersTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SmartRemindersTests
    dependencies:
      - target: SmartReminders
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
